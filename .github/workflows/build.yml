name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libkrb5-dev \
          sqlite3 \
          libsqlite3-dev \
          ssl-cert \
          libssl-dev \
          libgdbm-dev \
          libgdbm-compat-dev \
          liblzma-dev \
          libreadline-dev \
          libffi-dev \
          libbz2-dev \
          libncurses5-dev \
          libncursesw5-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          m4 \
          zip \
          unzip \
          openjdk-17-jdk

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Build with Buildozer (Auto Accept Licenses)
      run: |
        # Aceita licencias padrao
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer -v android debug || true
        # Aceita licencias especificas do SDK apos o buildozer inicializar os caminhos
        if [ -d "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi
        # Executa a compilacao definitiva
        buildozer -v android debug
        mv bin/*.apk bin/btc_alarm.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: btc_alarm.apk
        path: bin/btc_alarm.apk
