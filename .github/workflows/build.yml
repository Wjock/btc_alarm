name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libffi-dev libssl-dev autoconf automake libtool pkg-config m4 zip unzip

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Pre-accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      env:
        # Forca o Buildozer a usar o Android SDK ja instalado no GitHub
        ANDROIDSDK: ${{ env.ANDROID_HOME }}
      run: |
        buildozer -v android debug
        mv bin/*.apk bin/btc_alarm.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: btc_alarm.apk
        path: bin/btc_alarm.apk
